<!DOCTYPE html>
<html lang="de">

<head>
    <title>Formular</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            font-size: 30px;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }


        form {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
           
        }

        p {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

    </style>

</head>

<body>

    <nav>
        <a href="form.html">Formular</a>
        <a href="ausgabeform.html">Ausgabe</a>
    </nav>

    <form id="nameform">

        <p>
            <label for="firstname">Vorname</label>
            <input type="text" id="firstname" name="firstname" required>
        </p>

        <p>
            <label for="lastname">Nachname</label>
            <input type="text" id="lastname" name="lastname" required>
        </p>

        <p>
            <label for="eMail">E-Mail</label>
            <input type="email" id="eMail" name="eMail" required>
        </p>

        <p>
            <label for="tele">Telefonnummer</label>
            <input type="tel" id="tele" name="tele" required>
        </p>

        <p>
            <label for="farbe">Lieblingsfarbe</label>
            <input type="color" id="farbe" name="farbe" required>
        </p>

        <p>
            <label for="Geburtsdatum">Geburtsdatum</label>
            <input type="date" id="Geburtsdatum" name="Geburtsdatum" required>
        </p>

        <p>
            <input type="button" value="Absenden" onclick="onSubmitClick()">
        </p>

    </form>

</body>

<script>

function onSubmitClick() {

    const firstnameElement = document.querySelector("#firstname")
    const lastnameElement = document.querySelector("#lastname")
    const emailElement = document.querySelector("#eMail")
    const TelefonnummerElement = document.querySelector("#tele")
    const ColorElement = document.querySelector("#farbe")
    const DateElement = document.querySelector("#Geburtsdatum")

    const firstnameTextValue = firstnameElement.value;
    const lastnameTextValue = lastnameElement.value
    const emailTextValue = emailElement.value
    const TelefonnummerTextValue = TelefonnummerElement.value
    const colorTextValue = ColorElement.value
    const dateTextValue = DateElement.value

    localStorage.setItem("Vorname", firstnameTextValue)
    localStorage.setItem("Nachname", lastnameTextValue)
    localStorage.setItem("Email", emailTextValue)
    localStorage.setItem("Telefonnummer", TelefonnummerTextValue)
    localStorage.setItem("farbe", colorTextValue)
    localStorage.setItem("Geburtsdatum", dateTextValue)

    console.log(firstnameTextValue, lastnameTextValue, emailTextValue, TelefonnummerTextValue, colorTextValue, dateTextValue)
}

</script>

</html>
