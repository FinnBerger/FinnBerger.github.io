<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Weltenquiz</title>
</head>

<body>

    <div id="start">
        <h1>🌍Weltenquiz</h1>
        <button onclick="startQuiz()">Los geht's</button>
    </div>


    <div id="quiz" style="display:none;">
        <h2 id="frage"></h2>
        <h3 id="Ende"></h3>


        <button onclick="antwort(0)">Antwort A</button>
        <button onclick="antwort(1)">Antwort B</button>
        <button onclick="antwort(2)">Antwort C</button>

        <p id="meldung"></p>
    </div>

    <script>
        const fragen = [
            {
                text: "Was ist die Hauptstadt von Deutschland?",
                antworten: ["Berlin", "München", "Hamburg"],
                richtig: 0
            },
            {
                text: "Welcher Planet ist der größte?",
                antworten: ["Mars", "Jupiter", "Erde"],
                richtig: 1
            },
            {
                text: "Wie viele Kontinente gibt es?",
                antworten: ["6", "7", "8"],
                richtig: 1
            },
            {
                text: "Wie viele Bundesländer hat Österreich?",
                antworten: ["8", "7", "9"],
                richtig: 2
            },
            {
                text: "Was ist der längste Fluss der Welt?",
                antworten: ["Nil", "Amazonas", "Donau"],
                richtig: 0
            }
        ];

        let nr = 0;

        function startQuiz() {
            document.getElementById("start").style.display = "none";
            document.getElementById("quiz").style.display = "block";
            anzeigen();
        }

        function anzeigen() {


            document.getElementById("frage").textContent = fragen[nr].text;

            const buttons = document.querySelectorAll("#quiz button");
            buttons.forEach((btn, i) => {
                btn.textContent = fragen[nr].antworten[i];
            });

            document.getElementById("meldung").textContent = "";


        }

        function antwort(index) {
            if (index === fragen[nr].richtig) {
                document.getElementById("meldung").textContent = "Richtig ";
            } else {
                document.getElementById("meldung").textContent = "Falsch ";
            }

            nr++;

            if (nr < fragen.length) {
                setTimeout(anzeigen, 500);
            } else {
                document.getElementById("Ende").textContent = "Quiz beendet ";
                document.getElementById("meldung").textContent = "";
                function weiter() { document.getElementById("quiz").style.display = "none"; }
                

            }
        }

    </script>
    <style>
        h1 {
            color: rgb(68, 136, 0);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            font-size: 50px;
        }

        h2 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            font-size: 40px
        }

        button {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            font-size: 50px;
            margin-top: 50px;
        }

        body {
            text-align: center;
        }

        h3 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            font-size: 50px;
            margin-top: 50px;
        }

        p {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 30px
        }
    </style>

</body>

</html>
